# Надстройка для сервера: Caddy принимает запросы на 80/443 и сам получает
# HTTPS-сертификат Let's Encrypt для домена из SITE_ADDRESS.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  frontend:
    # наружу смотрит только Caddy
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # домен (lesson.example.ru) — будет HTTPS; пусто — обычный HTTP на 80 порту по IP
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
